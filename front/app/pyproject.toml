[project]
name = "aikon"
version = "0.1.0"
description = "Computer vision platform for the Digital Humanities"
readme = "README.md"
requires-python = ">=3.11, <=3.13"
dependencies = [
    "django>=5.2.11",
    "djangorestframework>=3.15.2",
    "django-admin-extra-buttons>=1.5.4",
    "django-admin-searchable-dropdown>=1.2",
    "django-autocomplete-light>=3.12.1",
    "django-classy-tags>=3.0.1",
    "django-cors-headers>=3.13.0",
    "django-crispy-forms>=1.14.0",
    "django-filter>=23.5",
    "django-native-tags>=0.5.3",
    "django-nested-admin>=4.1.6",
    "django-polymorphic>=3.1.0",

    "celery>=5.3.1",
    "fontawesomefree>=6.1.1",
    "iiif-download>=0.1.15",
    "iiif-prezi>=0.3.0",
    "imagesize>=1.4.1",
    "numpy>=2.4.2",
    "orjson>=3.11.7",
    "packaging>=21.3",
    "pdf2image>=1.16.2",
    "pillow>=12.1.1",
    "pycparser>=2.21",
    "pymupdf-img>=0.1.1",
    "pyparsing>=3.0.9",
    "python-dateutil>=2.8.2",
    "python-environ>=0.4.54",
    "redis>=4.5.5",
    "requests>=2.32.5",
    "setuptools>=80.10.2",
    "stream-unzip>=0.0.99",
    "tqdm>=4.67.3",
    "tripoli>=2.0.0",
    "urllib3>=2.6.3",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.2.0",
    "django-livereload-server>=0.4",
    "pandas>=2.3.0",
    "pre-commit>=2.19.0",
    "dramatiq[redis,watch]>=2.0.1",
]
prod = [
    "gunicorn>=25.1.0",
]
